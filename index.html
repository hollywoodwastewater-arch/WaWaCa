              className="w-full bg-slate-900/50 border border-slate-700/50 rounded-xl pl-12 pr-4 py-3 text-white outline-none focus:border-water-500/50 transition-colors"
            />
          </div>

          {/* Formulas */}
          <div className="space-y-3">
            {filteredFormulas.map((cat, catIdx) => (
              <div key={catIdx} className="bg-slate-900/30 rounded-2xl border border-slate-800/50 overflow-hidden">
                <button
                  onClick={() => setExpandedSection(expandedSection === catIdx ? null : catIdx)}
                  className="w-full p-4 flex items-center justify-between text-left hover:bg-slate-800/30 transition-colors"
                >
                  <span className="font-bold text-white">{cat.category}</span>
                  <div className="flex items-center gap-2">
                    <span className="text-xs text-slate-500 bg-slate-800 px-2 py-1 rounded-lg">{cat.items.length}</span>
                    <Icon name={expandedSection === catIdx ? "chevronUp" : "chevronDown"} className="w-5 h-5 text-slate-500" />
                  </div>
                </button>
                {expandedSection === catIdx && (
                  <div className="border-t border-slate-800/50 p-4 space-y-3">
                    {cat.items.map((item, idx) => (
                      <div key={idx} className="p-3 bg-slate-900/50 rounded-xl border border-slate-800/30">
                        <div className="font-medium text-water-400 text-sm mb-1">{item.name}</div>
                        <div className="font-mono text-white text-sm">{item.formula}</div>
                        {item.alt && <div className="font-mono text-slate-500 text-xs mt-1">Alt: {item.alt}</div>}
                        {item.note && <div className="text-xs text-slate-500 mt-1 italic">{item.note}</div>}
                      </div>
                    ))}
                  </div>
                )}
              </div>
            ))}
          </div>

          {/* Conversions */}
          <div className="bg-slate-900/30 rounded-2xl border border-slate-800/50 overflow-hidden">
            <button
              onClick={() => setExpandedSection(expandedSection === 'conv' ? null : 'conv')}
              className="w-full p-4 flex items-center justify-between text-left hover:bg-slate-800/30 transition-colors"
            >
              <span className="font-bold text-white flex items-center gap-2">
                <Icon name="arrowLeftRight" className="w-4 h-4 text-water-400" /> Conversion Factors
              </span>
              <Icon name={expandedSection === 'conv' ? "chevronUp" : "chevronDown"} className="w-5 h-5 text-slate-500" />
            </button>
            {expandedSection === 'conv' && (
              <div className="border-t border-slate-800/50 p-4">
                <div className="grid md:grid-cols-2 gap-2">
                  {conversions.map((c, idx) => (
                    <div key={idx} className="p-2 bg-slate-900/50 rounded-lg border border-slate-800/30 flex items-center gap-2">
                      <span className="font-mono text-water-400 text-sm">{c.from}</span>
                      <span className="text-slate-600">=</span>
                      <span className="font-mono text-white text-sm">{c.to}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>

          {/* Abbreviations */}
          <div className="bg-slate-900/30 rounded-2xl border border-slate-800/50 overflow-hidden">
            <button
              onClick={() => setExpandedSection(expandedSection === 'abbr' ? null : 'abbr')}
              className="w-full p-4 flex items-center justify-between text-left hover:bg-slate-800/30 transition-colors"
            >
              <span className="font-bold text-white flex items-center gap-2">
                <Icon name="bookOpen" className="w-4 h-4 text-water-400" /> Abbreviations
              </span>
              <Icon name={expandedSection === 'abbr' ? "chevronUp" : "chevronDown"} className="w-5 h-5 text-slate-500" />
            </button>
            {expandedSection === 'abbr' && (
              <div className="border-t border-slate-800/50 p-4">
                <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-2">
                  {abbrevs.map((a, idx) => (
                    <div key={idx} className="p-2 bg-slate-900/50 rounded-lg border border-slate-800/30">
                      <span className="font-mono text-water-400 font-bold">{a.abbr}</span>
                      <span className="text-slate-500 mx-2">—</span>
                      <span className="text-slate-300 text-sm">{a.meaning}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>
        </div>
      );
    };

    // ═══════════════════════════════════════════════════════════════
    // MAIN APP
    // ═══════════════════════════════════════════════════════════════

    const App = () => {
      const [activeModule, setActiveModule] = useState('calc');
      const [activeCalc, setActiveCalc] = useState('tank');
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [lastVol, setLastVol] = useLocalStorage("wwp_vol", {});
      const [isOffline, setIsOffline] = useState(!navigator.onLine);

      useEffect(() => {
        const update = () => setIsOffline(!navigator.onLine);
        window.addEventListener('online', update);
        window.addEventListener('offline', update);
        return () => {
          window.removeEventListener('online', update);
          window.removeEventListener('offline', update);
        };
      }, []);

      const modules = [
        { id: 'calc', label: 'Calculators', icon: 'calculator' },
        { id: 'flowpro', label: 'Flow Simulator', icon: 'trendingUp' },
        { id: 'formulas', label: 'Formula Reference', icon: 'bookOpen' },
      ];

      const calcMenus = [
        { id: "tank", label: "Tank Volume", icon: "cylinder" },
        { id: "pipe", label: "Pipe Volume", icon: "pipette" },
        { id: "detention", label: "Detention Time", icon: "timer" },
        { id: "loading", label: "Loading Rate", icon: "scale" },
        { id: "clarifier", label: "Clarifier SOR", icon: "circleDot" },
        { id: "ras", label: "RAS Rate", icon: "repeat" },
        { id: "fm", label: "F/M Ratio", icon: "bug" },
        { id: "mcrt", label: "MCRT / SRT", icon: "clock" },
        { id: "chlorine", label: "Disinfection", icon: "flaskConical" },
        { id: "digester", label: "Digester VS%", icon: "flame" },
        { id: "pump", label: "Pump Efficiency", icon: "zap" },
        { id: "asr", label: "ASR Flow & Ops", icon: "waves" },
        { id: "convert", label: "Unit Converter", icon: "arrowLeftRight" },
      ];

      const renderCalc = () => {
        switch(activeCalc) {
          case "tank": return <TankVolume setLastVolume={setLastVol} goTo={setActiveCalc} />;
          case "pipe": return <PipeVolume />;
          case "loading": return <LoadingRate />;
          case "ras": return <RASRate />;
          case "detention": return <DetentionTime lastVol={lastVol} />;
          case "clarifier": return <Clarifier lastVol={lastVol} />;
          case "fm": return <FMRatio />;
          case "mcrt": return <MCRT />;
          case "chlorine": return <Chlorine />;
          case "digester": return <Digester />;
          case "pump": return <PumpCalc />;
          case "asr": return <ASRCalc />;
          case "convert": return <UnitConverter />;
          default: return <TankVolume setLastVolume={setLastVol} goTo={setActiveCalc} />;
        }
      };

      const calcTitle = calcMenus.find(m => m.id === activeCalc)?.label || 'Calculator';

      return (
        <div className="min-h-screen flex flex-col gradient-mesh">
          {/* Header */}
          <header className="glass border-b border-slate-800/50 sticky top-0 z-40">
            <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-water-500 to-cyan-600 flex items-center justify-center shadow-lg shadow-water-500/30">
                  <Icon name="droplets" className="w-5 h-5 text-white" />
                </div>
                <div>
                  <h1 className="text-lg font-bold text-white font-display tracking-tight">WaterWorks Pro</h1>
                  <div className="flex items-center gap-2 text-[10px] font-medium">
                    <span className={`flex items-center gap-1 ${isOffline ? 'text-amber-400' : 'text-emerald-400'}`}>
                      <Icon name={isOffline ? 'wifiOff' : 'wifi'} className="w-3 h-3" />
                      {isOffline ? 'Offline' : 'Online'}
                    </span>
                    <span className="text-slate-600">•</span>
                    <span className="text-slate-500">v6.0</span>
                  </div>
                </div>
              </div>
              
              {/* Module Tabs */}
              <div className="hidden md:flex bg-slate-900/50 rounded-xl p-1 border border-slate-800/50">
                {modules.map(m => (
                  <button
                    key={m.id}
                    onClick={() => setActiveModule(m.id)}
                    className={`px-4 py-2 rounded-lg text-sm font-medium transition-all flex items-center gap-2 ${
                      activeModule === m.id 
                        ? 'bg-water-600 text-white shadow-lg shadow-water-500/20' 
                        : 'text-slate-400 hover:text-white'
                    }`}
                  >
                    <Icon name={m.icon} className="w-4 h-4" />
                    {m.label}
                  </button>
                ))}
              </div>

              {/* Mobile Menu Button */}
              <button 
                onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
                className="md:hidden p-2 text-slate-400 hover:text-white"
              >
                <Icon name={mobileMenuOpen ? 'x' : 'menu'} className="w-6 h-6" />
              </button>
            </div>

            {/* Mobile Menu */}
            {mobileMenuOpen && (
              <div className="md:hidden border-t border-slate-800/50 p-4 space-y-2 animate-slide-up">
                {modules.map(m => (
                  <button
                    key={m.id}
                    onClick={() => { setActiveModule(m.id); setMobileMenuOpen(false); }}
                    className={`w-full px-4 py-3 rounded-xl text-left font-medium transition-all flex items-center gap-3 ${
                      activeModule === m.id 
                        ? 'bg-water-600 text-white' 
                        : 'text-slate-400 bg-slate-900/50'
                    }`}
                  >
                    <Icon name={m.icon} className="w-5 h-5" />
                    {m.label}
                  </button>
                ))}
              </div>
            )}
          </header>

          {/* Main Content */}
          <main className="flex-1 max-w-7xl mx-auto w-full px-4 py-6">
            {activeModule === 'calc' && (
              <div className="flex gap-6">
                {/* Calculator Sidebar */}
                <aside className="hidden lg:block w-64 shrink-0">
                  <div className="sticky top-24 space-y-1">
                    {calcMenus.map(m => (
                      <button
                        key={m.id}
                        onClick={() => setActiveCalc(m.id)}
                        className={`w-full px-4 py-3 rounded-xl text-left text-sm font-medium transition-all flex items-center gap-3 ${
                          activeCalc === m.id 
                            ? 'bg-water-600/20 text-water-400 border border-water-500/30' 
                            : 'text-slate-400 hover:bg-slate-800/50 hover:text-white'
                        }`}
                      >
                        <Icon name={m.icon} className={`w-4 h-4 ${activeCalc === m.id ? 'text-water-400' : 'text-slate-600'}`} />
                        {m.label}
                      </button>
                    ))}
                  </div>
                </aside>

                {/* Calculator Content */}
                <div className="flex-1 min-w-0">
                  {/* Mobile Calc Selector */}
                  <div className="lg:hidden mb-6">
                    <select
                      value={activeCalc}
                      onChange={(e) => setActiveCalc(e.target.value)}
                      className="w-full bg-slate-900/50 border border-slate-700/50 rounded-xl px-4 py-3 text-white font-medium outline-none focus:border-water-500/50"
                    >
                      {calcMenus.map(m => (
                        <option key={m.id} value={m.id}>{m.label}</option>
                      ))}
                    </select>
                  </div>

                  <div className="mb-6">
                    <h2 className="text-2xl font-bold text-white font-display">{calcTitle}</h2>
                    <p className="text-slate-500 text-sm mt-1">Enter values below to calculate</p>
                  </div>

                  <div className="animate-slide-up" key={activeCalc}>
                    {renderCalc()}
                  </div>
                </div>
              </div>
            )}

            {activeModule === 'flowpro' && (
              <div>
                <div className="mb-6">
                  <h2 className="text-2xl font-bold text-white font-display">Flow Simulator</h2>
                  <p className="text-slate-500 text-sm mt-1">Reservoir & Injection Management - 24hr Projection</p>
                </div>
                <FlowProSimulator />
              </div>
            )}

            {activeModule === 'formulas' && (
              <div>
                <div className="mb-6">
                  <h2 className="text-2xl font-bold text-white font-display">Formula Reference</h2>
                  <p className="text-slate-500 text-sm mt-1">ABC Certification Formula Sheet & Conversions</p>
                </div>
                <FormulaReference />
              </div>
            )}
          </main>

          {/* Footer */}
          <footer className="border-t border-slate-800/50 py-4 mt-auto">
            <div className="max-w-7xl mx-auto px-4 flex flex-col md:flex-row items-center justify-between gap-2 text-xs text-slate-600">
              <div className="flex items-center gap-2">
                <Icon name="droplets" className="w-4 h-4 text-water-600" />
                <span>WaterWorks Pro • Offline PWA</span>
              </div>
              <div className="text-center">
                Formulas: ABC Certification • ADEQ Grade 4
              </div>
              <div>
                Add to Home Screen for best experience
              </div>
            </div>
          </footer>
        </div>
      );
    };

    // Safely Mount React
    try {
      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    } catch (e) {
      console.error("React Mount Failed:", e);
      document.getElementById("error-overlay").style.display = "flex";
      document.getElementById("error-text").innerText = e.message;
    }
  </script>

  <!-- SERVICE WORKER -->
  <script>
    if ('serviceWorker' in navigator) {
      try {
        const swCode = `
            const CACHE_NAME = 'waterworks-pro-v6';
            const urlsToCache = [
                './',
                'https://cdn.tailwindcss.com',
                'https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js',
                'https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js',
                'https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js',
                'https://unpkg.com/lucide@0.263.1/dist/umd/lucide.min.js'
            ];
            
            // Install Event
            self.addEventListener('install', event => {
                self.skipWaiting();
                event.waitUntil(
                    caches.open(CACHE_NAME).then(cache => {
                        // Robust caching: Promise.allSettled allows some files to fail without crashing installation
                        return Promise.allSettled(
                            urlsToCache.map(url => 
                                fetch(url).then(response => {
                                    if (!response.ok) throw new Error('Network response for ' + url + ' was not ok');
                                    return cache.put(url, response);
                                }).catch(err => console.warn('Failed to cache ' + url, err))
                            )
                        );
                    })
                );
            });

            // Fetch Event (Network First for App Shell)
            self.addEventListener('fetch', event => {
                // Navigation requests (HTML)
                if (event.request.mode === 'navigate') {
                    event.respondWith(
                        fetch(event.request).catch(() => caches.match('./'))
                    );
                    return;
                }

                // Asset requests
                event.respondWith(
                    caches.match(event.request).then(response => {
                        return response || fetch(event.request);
                    })
                );
            });

            // Activate Event (Cleanup Old Caches)
            self.addEventListener('activate', event => {
                event.waitUntil(
                    caches.keys().then(names => Promise.all(names.map(name => {
                        if(name !== CACHE_NAME) return caches.delete(name);
                    })))
                );
            });
        `;
        const blob = new Blob([swCode], {type: 'text/javascript'});
        const swUrl = URL.createObjectURL(blob);
        window.addEventListener('load', () => navigator.serviceWorker.register(swUrl).catch(console.error));
      } catch (e) {
        console.warn("Service Worker registration failed (likely iframe restriction):", e);
      }
    }
  </script>

</body>
</html>
